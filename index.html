<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO_3941 CHAOS LAB 😂</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #39ff14;
    font-family: monospace;
}

body {
    background:
        radial-gradient(circle at center, #071407 0%, #000 65%),
        repeating-linear-gradient(
            90deg,
            transparent 0 30px,
            rgba(57,255,20,.025) 31px 32px
        );
}

#matrix {
    position: fixed;
    inset: 0;
    opacity: .18;
    pointer-events: none;
    overflow: hidden;
    font-size: 13px;
    line-height: 14px;
    word-break: break-all;
}

#hud {
    position: fixed;
    left: 30px;
    bottom: 25px;
    z-index: 2;
    pointer-events: none;
}

#hud h1 {
    margin: 0 0 10px;
    font-size: 20px;
    text-shadow: 0 0 10px #39ff14;
}

#status,
#counter {
    font-size: 14px;
}

#counter {
    margin-top: 8px;
}

/* AUDIO HUD */

#audioHud {
    position: fixed;
    right: 25px;
    top: 25px;
    width: 260px;
    padding: 15px;
    border: 2px solid #39ff14;
    background: rgba(0,0,0,.9);
    box-shadow: 0 0 15px rgba(57,255,20,.35);
    z-index: 5;
    text-align: center;
}

#soundBtn {
    margin-top: 10px;
    width: 100%;
    padding: 10px;
    background: #39ff14;
    color: #000;
    border: 2px solid #39ff14;
    font-family: monospace;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
}

#soundBtn:hover {
    background: #000;
    color: #39ff14;
}

/* POPUP */

.troll {
    position: fixed;
    width: 280px;
    min-height: 310px;
    padding: 20px;
    background: #f5f5f5;
    color: #111;
    border: 3px solid #39ff14;
    border-radius: 8px;
    box-shadow:
        0 0 8px #39ff14,
        0 0 30px rgba(57,255,20,.55);
    z-index: 100;
    text-align: center;
    user-select: none;
}

.troll h2 {
    margin: 0 0 10px;
    font-size: 24px;
}

.troll .face {
    display: block;
    width: 120px;
    height: 120px;
    object-fit: cover;
    margin: 8px auto;
    border-radius: 8px;
    border: 2px solid #111;
    box-shadow: 0 0 10px #39ff14;
}

.troll p {
    margin: 8px;
    font-weight: bold;
}

.close {
    position: absolute;
    right: 7px;
    top: 6px;
    background: #111;
    color: white;
    border: 0;
    padding: 3px 7px;
    font-family: monospace;
    font-weight: bold;
    cursor: pointer;
}

.close:hover {
    background: #39ff14;
    color: #000;
}

@media(max-width:600px) {

    #audioHud {
        right: 10px;
        top: 10px;
        width: 200px;
        font-size: 11px;
    }

    .troll {
        width: 240px;
        min-height: 285px;
    }

    .troll .face {
        width: 100px;
        height: 100px;
    }

    #hud {
        left: 10px;
        bottom: 10px;
    }
}
</style>
</head>

<body>

<div id="matrix"></div>

<!-- LOCAL MP3 -->
<audio
    id="chaosAudio"
    preload="auto"
    loop
    src="you are an idiot!_1786511327041.mp3">
</audio>

<div id="audioHud">
    <b>◉ AUDIO SYSTEM</b>

    <button id="soundBtn">
        🔊 ENABLE LOOPING SOUND
    </button>

    <div id="audioStatus">
        STATUS: WAITING 🔇
    </div>
</div>

<div id="hud">
    <h1>&gt; PRO_3941 CHAOS LAB</h1>
    <div id="status">
        &gt; SYSTEM STATUS: TROLLING 😂
    </div>
    <div id="counter">
        &gt; POPUPS: 0
    </div>
</div>

<script>

/* =========================
   CONFIG
========================= */

const IMAGE_FILE = "face.png";
const SPAWN_TIME = 20000;

const popups = [];


/* =========================
   MATRIX
========================= */

const chars =
    "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%@";

let matrixText = "";

for (let i = 0; i < 5000; i++) {
    matrixText +=
        chars[Math.floor(Math.random() * chars.length)];
}

document.getElementById("matrix")
    .textContent = matrixText;


/* =========================
   COUNTER
========================= */

function updateCounter() {

    document.getElementById("counter")
        .textContent =
        "> POPUPS: " + popups.length;
}


/* =========================
   CREATE POPUP
========================= */

function createPopup() {

    const popup =
        document.createElement("div");

    popup.className = "troll";

    popup.innerHTML = `
        <button class="close">X</button>

        <h2>YOU ARE AN IDIOT 😂</h2>

        <img
            class="face"
            src="${IMAGE_FILE}"
            alt="Hacker Face"
        >

        <p>HAHA LOSER 💀</p>
    `;

    document.body.appendChild(popup);


    const obj = {

        el: popup,

        x:
            Math.random() *
            Math.max(
                1,
                window.innerWidth - 300
            ),

        y:
            Math.random() *
            Math.max(
                1,
                window.innerHeight - 340
            ),

        dx:
            (Math.random() > .5 ? 1 : -1) *
            (1.5 + Math.random() * 2.5),

        dy:
            (Math.random() > .5 ? 1 : -1) *
            (1.5 + Math.random() * 2.5)
    };


    popups.push(obj);

    updateCounter();


    /* =========================
       X = DUPLICATE 😂
    ========================= */

    popup.querySelector(".close")
        .onclick = () => {

            popup.remove();

            const index =
                popups.indexOf(obj);

            if (index !== -1) {
                popups.splice(index, 1);
            }

            /* Spawn TWO replacements */

            createPopup();
            createPopup();

            updateCounter();
        };
}


/* =========================
   BOUNCING ENGINE
========================= */

function animate() {

    for (const p of popups) {

        if (!p.el.isConnected)
            continue;

        const maxX =
            Math.max(
                0,
                window.innerWidth -
                p.el.offsetWidth
            );

        const maxY =
            Math.max(
                0,
                window.innerHeight -
                p.el.offsetHeight
            );


        p.x += p.dx;
        p.y += p.dy;


        if (p.x <= 0) {
            p.x = 0;
            p.dx *= -1;
        }

        if (p.x >= maxX) {
            p.x = maxX;
            p.dx *= -1;
        }

        if (p.y <= 0) {
            p.y = 0;
            p.dy *= -1;
        }

        if (p.y >= maxY) {
            p.y = maxY;
            p.dy *= -1;
        }


        p.el.style.left =
            p.x + "px";

        p.el.style.top =
            p.y + "px";
    }

    requestAnimationFrame(animate);
}


/* =========================
   AUDIO
========================= */

const audio =
    document.getElementById("chaosAudio");

const soundBtn =
    document.getElementById("soundBtn");

const audioStatus =
    document.getElementById("audioStatus");


soundBtn.onclick = async () => {

    try {

        audio.currentTime = 0;

        await audio.play();

        audioStatus.textContent =
            "STATUS: LOOPING 🔊";

        soundBtn.textContent =
            "🔊 SOUND ENABLED";

        document.getElementById("status")
            .textContent =
            "> AUDIO ONLINE — CHAOS ACTIVE 😂";

    } catch (error) {

        console.error(error);

        audioStatus.textContent =
            "STATUS: AUDIO ERROR ❌";
    }
};


/* =========================
   INITIAL POPUP
========================= */

createPopup();


/* =========================
   EVERY 20 SECONDS
========================= */

setInterval(() => {

    createPopup();

}, SPAWN_TIME);


/* =========================
   START ENGINE
========================= */

animate();

</script>

</body>
  </html>
