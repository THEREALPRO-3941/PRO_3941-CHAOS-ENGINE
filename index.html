dx; p.y += p.dy; if (p.x <= 0) { p.x = 0; p.dx *= -1; } if (p.x >= maxX) { p.x = maxX; p.dx *= -1; } if (p.y <= 0) { p.y = 0; p.dy *= -1; } if (p.y >= maxY) { p.y = maxY; p.dy *= -1; } p.el.style.left = p.x + "px"; p.el.style.top = p.y + "px"; } requestAnimationFrame( animate ); } /* ========================================== FIRST POPUP ========================================== */ createPopup(); /* ========================================== TRY AUDIO IMMEDIATELY ========================================== */ startAudio(); /* ========================================== AUTOPLAY FALLBACK ========================================== */ function unlockAudio() { if (chaosAudio.paused) { startAudio(); } document.removeEventListener( "pointerdown", unlockAudio ); document.removeEventListener( "touchstart", unlockAudio ); } document.addEventListener( "pointerdown", unlockAudio ); document.addEventListener( "touchstart", unlockAudio ); /* ========================================== NEW POPUP EVERY 20 SECONDS ========================================== */ setInterval(() => { createPopup(); }, 20000); /* ========================================== START ANIMATION ========================================== */ animate(); </script> </body> </html>
