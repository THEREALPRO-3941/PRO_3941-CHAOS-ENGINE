<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO_3941 CHAOS LAB</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #39ff14;
    font-family: "Courier New", monospace;
}

body {
    background:
        radial-gradient(circle at center, #071407 0%, #000 65%),
        repeating-linear-gradient(
            90deg,
            transparent 0 30px,
            rgba(57,255,20,.025) 31px 32px
        );
}

/* 1. MATRIX */

#matrix {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: .18;
    pointer-events: none;
    overflow: hidden;
    font-size: 13px;
    line-height: 14px;
    word-break: break-all;
    color: #39ff14;
    text-shadow: 0 0 5px #39ff14;
}

/* 2. HUD */

#hud {
    position: fixed;
    left: 30px;
    bottom: 25px;
    z-index: 10;
    pointer-events: none;
    text-shadow: 0 0 8px #39ff14;
}

#hud h1 {
    margin: 0 0 10px;
    font-size: 20px;
}

#status,
#counter {
    font-size: 14px;
}

#counter {
    margin-top: 8px;
}

/* 3. AUDIO HUD */

#audioHud {
    position: fixed;
    right: 25px;
    top: 25px;
    width: 250px;
    padding: 15px;
    border: 2px solid #39ff14;
    background: rgba(0,0,0,.85);
    box-shadow: 0 0 15px rgba(57,255,20,.35);
    z-index: 1000;
}

#wave {
    margin-top: 10px;
    height: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
}

.bar {
    width: 4px;
    height: 8px;
    background: #39ff14;
    box-shadow: 0 0 5px #39ff14;
    animation: wave .45s infinite alternate;
}

.bar:nth-child(2n) {
    animation-delay: .1s;
}

.bar:nth-child(3n) {
    animation-delay: .2s;
}

@keyframes wave {
    from {
        height: 5px;
    }

    to {
        height: 24px;
    }
}

/* 4. POPUP */

.troll {
    position: fixed;
    width: 280px;
    min-height: 305px;
    padding: 20px;
    background: #f5f5f5;
    color: #111;
    border: 3px solid #39ff14;
    border-radius: 8px;
    box-shadow:
        0 0 8px #39ff14,
        0 0 30px rgba(57,255,20,.55);
    z-index: 100;
    text-align: center;
    user-select: none;
}

.troll h2 {
    margin: 0 0 10px;
    font-size: 24px;
}

.troll .face {
    display: block;
    width: 120px;
    height: 120px;
    object-fit: cover;
    margin: 8px auto;
    border-radius: 8px;
    border: 2px solid #111;
    box-shadow: 0 0 10px #39ff14;
}

.troll p {
    margin: 8px;
    font-weight: bold;
}

/* 5. X BUTTON */

.close {
    position: absolute;
    right: 7px;
    top: 6px;
    background: #111;
    color: white;
    border: 0;
    padding: 3px 7px;
    font-family: monospace;
    font-weight: bold;
    cursor: pointer;
}

.close:hover {
    background: #39ff14;
    color: #000;
}

/* 6. MOBILE */

@media (max-width: 600px) {

    #audioHud {
        right: 10px;
        top: 10px;
        width: 190px;
        font-size: 11px;
    }

    .troll {
        width: 240px;
        min-height: 285px;
        padding: 15px;
    }

    .troll h2 {
        font-size: 20px;
    }

    .troll .face {
        width: 100px;
        height: 100px;
    }

    #hud {
        left: 10px;
        bottom: 10px;
    }

    #hud h1 {
        font-size: 16px;
    }

    #status,
    #counter {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<!-- 7. MATRIX -->

<div id="matrix"></div>

<!-- 8. AUDIO -->

<audio id="chaosAudio" preload="auto" loop>
    <source
        src="./Pro_3941%20Chaos%20Mode%20%282%29.mp3"
        type="audio/mpeg"
    >
</audio>

<!-- 9. AUDIO HUD -->

<div id="audioHud">

    <b>◉ AUDIO SYSTEM</b>

    <div id="wave">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </div>

    <div>CHAOS AUDIO: LOOP 🔊</div>

</div>

<!-- 10. MAIN HUD -->

<div id="hud">

    <h1>&gt; PRO_3941 CHAOS LAB</h1>

    <div id="status">
        &gt; AUDIO: STARTING...
    </div>

    <div id="counter">
        &gt; POPUPS: 0
    </div>

</div>

<script>

/* 11. FILES */

const IMAGE_FILE = "face.png";

/* 12. MATRIX */

const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%@";
let matrixText = "";

for (let i = 0; i < 5000; i++) {
    matrixText += chars[
        Math.floor(Math.random() * chars.length)
    ];

    if (i % 100 === 0) {
        matrixText += "\n";
    }
}

document.getElementById("matrix").textContent = matrixText;

/* 13. POPUP ARRAY */

const popups = [];

/* 14. AUDIO */

const chaosAudio = document.getElementById("chaosAudio");
const status = document.getElementById("status");

chaosAudio.loop = true;
chaosAudio.volume = 1;

/* 15. AUDIO EVENTS */

chaosAudio.addEventListener("playing", function () {
    status.textContent = "> AUDIO: CHAOS MODE LOOPING 🔊";
});

chaosAudio.addEventListener("pause", function () {
    status.textContent = "> AUDIO: PAUSED ⏸️";
});

chaosAudio.addEventListener("error", function () {
    status.textContent = "> AUDIO: LOAD ERROR ❌";
});

/* 16. START AUDIO */

function startAudio() {
    chaosAudio.play().catch(function () {
        status.textContent = "> TAP SCREEN FOR AUDIO 🔊";
    });
}

/* 17. AUDIO UNLOCK */

document.addEventListener("pointerdown", function unlockAudio() {

    if (chaosAudio.paused) {
        startAudio();
    }

    document.removeEventListener(
        "pointerdown",
        unlockAudio
    );
});

/* 18. COUNTER */

function updateCounter() {
    document.getElementById("counter").textContent =
        "> POPUPS: " + popups.length;
}

/* 19. CREATE POPUP */

function createPopup() {

    const popup = document.createElement("div");

    popup.className = "troll";

    popup.innerHTML = `
        <button class="close" type="button">X</button>

        <h2>YOU ARE AN IDIOT 😂</h2>

        <img
            class="face"
            src="${IMAGE_FILE}"
            alt="Hacker Face"
        >

        <p>HAHA LOSER 💀</p>
    `;

    document.body.appendChild(popup);

    /* 20. MOVEMENT */

    const obj = {
        el: popup,

        x: Math.random() * Math.max(
            1,
            window.innerWidth - 300
        ),

        y: Math.random() * Math.max(
            1,
            window.innerHeight - 340
        ),

        dx:
            (Math.random() > 0.5 ? 1 : -1) *
            (1.5 + Math.random() * 2.5),

        dy:
            (Math.random() > 0.5 ? 1 : -1) *
            (1.5 + Math.random() * 2.5)
    };

    popups.push(obj);

    updateCounter();

    /* 21. X = +2 */

    popup.querySelector(".close").addEventListener(
        "click",
        function () {

            popup.remove();

            const index = popups.indexOf(obj);

            if (index !== -1) {
                popups.splice(index, 1);
            }

            createPopup();
            createPopup();

            updateCounter();
        }
    );
}

/* 22. BOUNCING */

function animate() {

    for (const p of popups) {

        if (!p.el.isConnected) {
            continue;
        }

        const maxX = Math.max(
            0,
            window.innerWidth - p.el.offsetWidth
        );

        const maxY = Math.max(
            0,
            window.innerHeight - p.el.offsetHeight
        );

        p.x += p.dx;
        p.y += p.dy;

        /* 23. X BOUNCE */

        if (p.x <= 0) {
            p.x = 0;
            p.dx *= -1;
        }

        if (p.x >= maxX) {
            p.x = maxX;
            p.dx *= -1;
        }

        /* 24. Y BOUNCE */

        if (p.y <= 0) {
            p.y = 0;
            p.dy *= -1;
        }

        if (p.y >= maxY) {
            p.y = maxY;
            p.dy *= -1;
        }

        p.el.style.left = p.x + "px";
        p.el.style.top = p.y + "px";
    }

    requestAnimationFrame(animate);
}

/* 25. FIRST POPUP */

createPopup();

/* 26. INITIAL AUDIO */

startAudio();

/* 27. +1 EVERY 20 SECONDS */

setInterval(function () {
    createPopup();
}, 20000);

/* 28. START */

animate();

</script>

</body>
</html>
